sentence=Mise a jour du firmware par HTTP en une seule etape, sans ElegantOTA.
paragraph=Remplace ElegantOTA sur un serveur web synchrone ESP8266/ESP32. Un seul POST multipart suffit (Update.begin est appele a UPLOAD_FILE_START), le code HTTP reflete l'etat reel (500 si rien n'a ete ecrit), le redemarrage est differe, et un POST non multipart ne fait plus planter la carte. Retire ESPAsyncWebServer et ESPAsyncTCP de l'arbre de dependances.
