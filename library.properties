sentence=Mise a jour du firmware par HTTP en une seule etape, serveur synchrone ou asynchrone.
paragraph=Remplace ElegantOTA sur serveur web synchrone (WebServer / ESP8266WebServer) ET asynchrone (AsyncWebServer) ESP8266/ESP32. Un seul POST multipart suffit (Update.begin est appele a UPLOAD_FILE_START), le code HTTP reflete l'etat reel (500 si rien n'a ete ecrit), le redemarrage est differe, et un POST non multipart ne fait plus planter la carte. Trois fichiers : ESP_OTA.h (tronc commun), ESP_OTA_Sync.h, ESP_OTA_Async.h (opt-in : seul l'utilisateur de l'asynchrone declare ESPAsyncWebServer).
